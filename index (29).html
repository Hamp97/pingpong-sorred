    <ellipse cx="25" cy="38" rx="21" ry="23" fill="#D32F2F" stroke="#fff" stroke-width="2"/>
    <ellipse cx="25" cy="38" rx="18" ry="20" fill="#B71C1C"/>
    <path d="M21 59 L25 64 L29 59 Z" fill="#fff"/>
  </svg>`;
}

function wheelSvg(){
  const tot=WHEEL.reduce((s,x)=>s+x.weight,0), R=205, C=220; let a0=0;
  const pt=a=>[(C+R*Math.sin(a*Math.PI/180)).toFixed(2),(C-R*Math.cos(a*Math.PI/180)).toFixed(2)];
  const slices = WHEEL.map(x=>{
    const span=360*x.weight/tot, a1=a0+span, [x0,y0]=pt(a0), [x1,y1]=pt(a1), mid=a0+span/2;
    const shape = WHEEL.length===1 ? `<circle cx="${C}" cy="${C}" r="${R}" fill="${x.color}"/>`
      : `<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${span>180?1:0} 1 ${x1},${y1} Z" fill="${x.color}" stroke="#ffffff" stroke-width="3.5"/>`;
    x._a0=a0; x._span=span; a0=a1;
    const isJp = !!x.jackpot;
    return shape+`<g transform="rotate(${mid.toFixed(2)} ${C} ${C})">
      <text x="${C}" y="${C-R+48}" text-anchor="middle" font-size="${isJp?38:32}">${x.emoji}</text>
      <text x="${C}" y="${C-R+78}" text-anchor="middle" font-size="${isJp?19:16.5}" font-weight="900" fill="#fff" font-family="Outfit,Inter,sans-serif" filter="drop-shadow(0 2px 4px rgba(0,0,0,.7))">${esc(x.short)}</text>
      ${isJp?`<text x="${C}" y="${C-R+98}" text-anchor="middle" font-size="11.5" font-weight="900" fill="#FFF275" font-family="Outfit,Inter,sans-serif" letter-spacing="1">JACKPOT</text>`:''}
    </g>`;
  }).join('');

  const hub = `
    <circle cx="${C}" cy="${C}" r="38" fill="url(#ballGrad)" stroke="#E2E8F0" stroke-width="3" filter="drop-shadow(0 6px 8px rgba(0,0,0,.4))"/>
    <text x="${C}" y="${C-8}" text-anchor="middle" font-size="15" font-weight="900" fill="#E65100" font-family="Outfit,Inter,sans-serif">★★★</text>
    <text x="${C}" y="${C+8}" text-anchor="middle" font-size="11" font-weight="800" fill="#1E293B" font-family="Outfit,Inter,sans-serif">SÖRRED</text>
    <text x="${C}" y="${C+21}" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" font-family="Outfit,Inter,sans-serif">40+ TOUR</text>
  `;

  return `<defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>${slices}${hub}`;
}

let isSpinningLocked = false;

function spinWheel(){
  if(!sel.w||!sel.l) return;
  if(hsOn||recAs) return toast('Spin the wheel only works for normal matches.',true);
  if(!readScores()) return;
  const w=P(sel.w), l=P(sel.l), tot=WHEEL.reduce((s,x)=>s+x.weight,0);
  isSpinningLocked = true;
  openModal(`<div class="wheel-wrap spinning"><h2 style="margin:0 0 4px">🏓 Spin the wheel 😉</h2>
    <p class="sub" style="margin:0"><b>${esc(w.name)}</b> vs <b>${esc(l.name)}</b> · <i>No undo once spun!</i></p>
    <div class="wheel"><div class="wheel-ptr">${wheelPaddlePointerSvg()}</div>
      <svg id="wheelSvg" viewBox="0 0 440 440">${wheelSvg()}</svg>
    </div>
    <div id="wheelRes" class="wheel-res" style="color:var(--accent)">Spinning the table… 🏓</div>
    <div class="wheel-odds">${WHEEL.map(x=>`<span style="background:${x.color};${x.jackpot?'box-shadow:0 0 10px #FFB800;font-weight:900':''}">${x.emoji} ${esc(x.label)} · ${Math.round(100*x.weight/tot)}%</span>`).join('')}</div>
  </div>`);

  let r=Math.random()*tot, pick=WHEEL[WHEEL.length-1];
  for(const x of WHEEL){ if(r<x.weight){ pick=x; break; } r-=x.weight; }
  const land=pick._a0+pick._span*(0.2+0.6*Math.random());
  const svg=$('#wheelSvg');

  // Near miss detection (within 22 degrees of the 5x Jackpot slice, but not on it)
  const jpSlice = WHEEL.find(x=>x.id==='5x');
  const jpStart = jpSlice ? jpSlice._a0 : 0;
  const jpEnd = jpSlice ? jpSlice._a0 + jpSlice._span : 28;
  const isNearMiss = pick.id !== '5x' && ((land >= jpEnd && land <= jpEnd + 22) || (land <= 360 && land >= 360 - 18));

  const totalTicks = 32;
  for(let i=0; i<totalTicks; i++){
    const timeRatio = Math.pow(i/totalTicks, 2.3);
    const delayMs = 100 + timeRatio * 4400;
    setTimeout(()=>{
      if(!isSpinningLocked) return;
      // In the final 1.2s, if near miss or creeping to stop, switch to tense heartbeat!
      if(i >= totalTicks - 4 && (isNearMiss || pick.id==='5x')){
        playHeartbeatSound();
      } else {
        playPingPongSound(620 + (totalTicks - i) * 5, 0.035);
      }
    }, delayMs);
  }

  if(isNearMiss){
    setTimeout(()=>{
      if(!isSpinningLocked || !$('#wheelRes')) return;
      $('#wheelRes').innerHTML = `<span style="color:#E5A000;animation:bounce .4s infinite alternate;display:inline-block">😱 SÅ NÄRA! Bara millimeter från 5× Jackpot!</span>`;
    }, 3800);
  }

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    svg.style.transform=`rotate(${360*7-land}deg)`;
  }));

  setTimeout(()=>{
    if(!$('#wheelSvg')) return;
    playPingPongSound(880, 0.25);
    const isJp = !!pick.jackpot;
    const isRev = !!pick.reverse;
    const isDbl = !!pick.gamble;
    const isSplt = !!pick.split;
    $('#wheelRes').innerHTML=`<span style="${isJp?'color:#E5A000;font-size:24px;font-weight:900':isRev?'color:#10B981;font-weight:900':isDbl?'color:#D926A9;font-weight:900':''}">${pick.emoji} ${esc(pick.label)}! ${isJp?'🎉':isRev?'😈':isDbl?'💣':isSplt?'🤝':''}</span>`;

    setTimeout(async()=>{
      if(isDbl){
        // Double or nothing gamble prompt!
        triggerDoubleGamble(w, l);
      } else {
        isSpinningLocked = false;
        closeModal();
        await saveMatch(pick.id);
      }
    }, 2000);
  }, 4800);
}

function triggerDoubleGamble(w, l){
  const Rw = state.R[w.id], Rl = state.R[l.id];
  const d = eloDeltas(Rw.mmr, Rl.mmr, Rw.games, Rl.games, hsOn);
  $('#mbody').innerHTML = `
    <div style="text-align:center;padding:12px 6px">
      <div style="font-size:48px;animation:bounce .5s infinite alternate">💣</div>
      <h2 style="margin:4px 0">DOUBLE OR NOTHING!</h2>
      <p class="sub" style="margin:0 0 16px"><b>${esc(w.name)}</b> vann matchen (+${d.dW} MMR).<br>Vågar du satsa för <b>4× MMR</b> eller riskera att gå tomhänt?</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost big" id="btnGambleTake">🛡️ Nöjd med +${d.dW} MMR</button>
        <button class="btn primary big" id="btnGambleSpin" style="background:#D926A9">🎰 SATSA FÖR 4× MMR (+${d.dW*4})!</button>
      </div>
      <div id="gambleStatus" style="font-size:18px;font-weight:800;margin-top:16px;min-height:28px"></div>
    </div>
  `;
  $('#btnGambleTake').onclick = async()=>{
    isSpinningLocked = false; closeModal(); await saveMatch('double_take');
  };
  $('#btnGambleSpin').onclick = ()=>{
    $('#btnGambleTake').disabled = true; $('#btnGambleSpin').disabled = true;
    const st = $('#gambleStatus');
    st.innerHTML = 'Kastar myntet... 🪙';
    let cnt = 0;
    const iv = setInterval(()=>{
      cnt++; playHeartbeatSound();
      st.innerHTML = cnt%2 ? '💥 4× MMR?!' : '💀 0 MMR?!';
      if(cnt >= 12){
        clearInterval(iv);
        const win = Math.random() < 0.5;
        playPingPongSound(win ? 900 : 300, 0.4);
        st.innerHTML = win
          ? '<span style="color:#16A36A;font-size:24px">🎉 VINST! 4× MMR BÄRGAT!</span>'
          : '<span style="color:#DC2626;font-size:24px">💀 BUST! 0 MMR till vinnaren!</span>';
        setTimeout(async()=>{
          isSpinningLocked = false; closeModal(); await saveMatch(win ? 'double_win' : 'double_bust');
        }, 1800);
      }
    }, 180);
  };
}

    return `<tr><td>${g}</td><td>${pct(fav.pW)}</td><td>+${fav.dW}</td><td><b>+${dog.dW}</b></td></tr>`; }).join('');

function celebrate(o){

  const calls=[];
  if(o.bounty) calls.push(`🎯 BOUNTY CLAIMED! +${o.bounty} bonus MMR`);
  if(o.streak>=3) calls.push(`🔥 ${o.streak} wins in a row`); else if(o.streak===2) calls.push('🔥 2 in a row');
  if(o.upset) calls.push(`😱 Upset! Only ${pct(o.pW)} chance`);
  if(o.rankAfter&&o.rankBefore&&o.rankAfter<o.rankBefore) calls.push(`📈 Up to #${o.rankAfter}`);
  else if(o.rankAfter===1) calls.push('👑 Still #1');
  if(o.brokeStreak>=3) calls.push(`🧊 Ended ${esc(l.name.split(' ')[0])}'s ${o.brokeStreak}-game streak`);

  const wFirst = esc(w.name.split(' ')[0]), lFirst = esc(l.name.split(' ')[0]);

  // Clean title & eyebrow formatting
  let eyebrow = o.champion ? '🏆 Champion 🏆' : esc(o.label || 'Victory');

  let vsText = `<span>beat</span>${avatar(l,32)}<span>${esc(l.name)}</span>`;
  let mmrChips = '';

  if(o.draw){
    eyebrow = `🎡 ${esc(o.label || 'Oavgjort / Draw')}`;
    title = 'Oavgjort!';
    vsText = `<span>drew with</span>${avatar(l,32)}<span>${esc(l.name)}</span>`;

  } else if(o.spin==='double_bust'){

    eyebrow = '💣 4× DOUBLE WIN!';
    title = 'Jackpot bärgad!';
    mmrChips = `<span class="cel-chip up" data-cel="${o.dW}">+0</span><span class="cel-chip down">${lFirst} ${o.dL}</span>`;
  } else if(o.dW!=null){
    const loserChip = o.dL===0
      ? `<span class="cel-chip neutral">${lFirst} 0</span>`
      : `<span class="cel-chip down">${lFirst} ${o.dL}</span>`;
    mmrChips = `<span class="cel-chip up" data-cel="${o.dW}">+0</span>${loserChip}`;
  } else {
    mmrChips = `<span class="cel-chip neutral">${esc(o.note||'MMR unchanged')}</span>`;
  }

  const el=document.createElement('div'); el.id='celebrate'; el.className='cel'+(o.champion?' champ':'');
  el.innerHTML=`<canvas></canvas><div class="cel-card">
    <div class="cel-eyebrow" style="letter-spacing:1.5px">${eyebrow}</div>
    <div class="cel-title" style="margin-bottom:12px">${title}</div>
    <div class="cel-av">${avatar(w,o.champion?180:150)}</div>
    <div class="cel-name">${esc(w.name)}</div>
    <div class="cel-vs">${vsText}</div>
    <div class="cel-mmr">${mmrChips}</div>
    ${calls.length?`<div class="cel-calls">${calls.map(c=>`<span>${c}</span>`).join('')}</div>`:'<div style="height:14px"></div>'}
    <div class="cel-btns"><button class="btn primary big" id="celOk">Nice! 🏓</button>${o.undo?'<button class="btn ghost" id="celUndo">↩ Undo</button>':''}</div>
  </div><div class="cel-prog"></div>`;
  document.body.appendChild(el);
  el.addEventListener('click',e=>{ if(e.target===el) closeCelebrate(); });
  $('#celOk').onclick=closeCelebrate;
  if(o.undo) $('#celUndo').onclick=async()=>{ closeCelebrate(); try{ await o.undo(); }catch(e){ toast(esc(e.message),true); } };
  confetti(el.querySelector('canvas'),!!o.champion);
  const chip=el.querySelector('[data-cel]'); if(chip) setTimeout(()=>countUp(chip,+chip.dataset.cel,900,'+'),350);
  celTimer=setTimeout(closeCelebrate,6000);
}
function pickLine(name){
  const first=esc(String(name).split(' ')[0]);
  const lines=['What a game!','Point, set, match!','Unstoppable!','Clean sweep!','Table master!',`Go ${first}!`,'Smashed it!'];
  return lines[Math.floor(Math.random()*lines.length)];
}
const rankOf=id=>{ const r=ranked().filter(p=>state.R[p.id].games>=PROVISIONAL); const i=r.findIndex(p=>p.id===id); return i<0?null:i+1; };

/* =========================================================
   APP SHELL
   ========================================================= */
function openModal(html){ $('#mbody').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){
  if(isSpinningLocked) return; // Locked during spin!
  $('#modal').classList.add('hidden'); $('#mbody').innerHTML=''; if(charts.profChart){charts.profChart.destroy();delete charts.profChart;}
}
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal' && !isSpinningLocked) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !isSpinningLocked){ closeModal(); closeCelebrate(); } });
function toast(html,err=false,action=null){
  const el=document.createElement('div'); el.className='ts'+(err?' err':''); el.innerHTML=`<span>${html}</span>`;
  if(action){ const b=document.createElement('button'); b.textContent=action.label; b.onclick=async()=>{el.remove();try{await action.fn();}catch(e){toast(esc(e.message),true);}}; el.appendChild(b); }
  const ms=action?8000:4000; const bar=document.createElement('i'); bar.className='tbar'; bar.style.animationDuration=ms+'ms'; el.appendChild(bar);
  $('#toast').appendChild(el); setTimeout(()=>{ el.style.transition='opacity .25s,transform .25s'; el.style.opacity='0'; el.style.transform='translateY(10px)'; setTimeout(()=>el.remove(),260); }, ms);
}
function show(v){
  view=['play','dash','players','tourn','history','mmr','gazette'].includes(v)?v:'play';
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+view));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(location.hash.slice(1)!==view) history.replaceState(null,'','#'+view);
  const mainEl=document.querySelector('main'); mainEl.classList.remove('anim'); void mainEl.offsetWidth; mainEl.classList.add('anim');
  clearTimeout(show._t); show._t=setTimeout(()=>mainEl.classList.remove('anim'),1400);
  renderView(); runCountUps($('#v-'+view)); window.scrollTo({top:0,behavior:'smooth'});
}
function renderView(){ ({play:renderPlay,dash:renderDash,players:renderPlayers,tourn:renderTourn,history:renderHistory,mmr:renderMMR,gazette:renderGazette})[view](); }
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#gear').onclick=openSettings;

async function refresh(background=false){
  try{
    const d=await store.load();
    const pack=x=>JSON.stringify([x.players,x.matches,x.tournaments,x.tplayers,x.tmatches,x.tMissing]);
    const changed = pack(d)!==pack(state);
    state.players=d.players||[]; state.matches=d.matches||[];
    state.tournaments=d.tournaments||[]; state.tplayers=d.tplayers||[]; state.tmatches=d.tmatches||[]; state.tMissing=!!d.tMissing;
    if(tview&&!T(tview)) tview=null;
    if(sel.w&&!P(sel.w)) sel.w=null; if(sel.l&&!P(sel.l)) sel.l=null;
    compute();
    if(background && (!changed || (view==='play'&&sel.w&&sel.l) || (view==='tourn'&&(tsel.w||tsel.l)) || !$('#modal').classList.contains('hidden'))) return; // don't disturb someone mid-entry
    renderView();
    if(store.mode==='supabase') $('#banner').innerHTML='';
  }catch(e){
    console.error(e);
    $('#banner').innerHTML=`<div class="bn err">⚠️ ${state.players.length?'Something went wrong showing this page':'Couldn\'t load data'}: ${esc(e.message)} <button class="btn ghost" onclick="openSettings()">Check settings</button></div>`;
  }
}
async function init(){
  const cfg=getCfg();
  store = cfg ? sbStore(cfg) : demoStore();
  if(store.mode==='demo') $('#banner').innerHTML=`<div class="bn demo">🟡 <b>Demo mode</b> – sample data, saved only in this browser. Connect Supabase so the whole team shares one league. <button class="btn ghost" onclick="openSettings()">⚙️ Connect</button></div>`;
  $('#v-play').classList.add('on');
  $('#v-play').innerHTML=`<div class="sk sk-hero"></div><div class="tiles">${'<div class="sk sk-tile"></div>'.repeat(6)}</div>`;
  await refresh();
  show(location.hash.slice(1)||'play');
  if(store.mode==='supabase'){
    setInterval(()=>refresh(true),30000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(true); });
  }
}
init();
