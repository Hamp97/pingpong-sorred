<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outnorth: Ping Pong Sörred World tour</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ---- Brand colours: tweak here ---- */
:root{
  --navy:#0B1F4B; --navy-2:#16306b; --accent:#E4002B; --accent-2:#b80023;
  --gold:#F2B705; --green:#1E9E5A; --red:#D33A3A; --cold:#3B82C4;
  --bg:#F5F3EE; --card:#fff; --text:#1b2236; --muted:#6b7280; --line:#e6e2d8;
  --radius:14px; --shadow:0 2px 10px rgba(11,31,75,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.2px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:18px}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;letter-spacing:1.5px;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.75;padding:9px 14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer}
nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav button.on{opacity:1;background:var(--accent)}
#gear{background:rgba(255,255,255,.1);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px}
#banner{max-width:1200px;margin:12px auto 0;padding:0 20px}
.bn{padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bn.demo{background:#fff4d6;border:1px solid #f0d58a}
.bn.err{background:#fde8e8;border:1px solid #f3b4b4}
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
section{display:none} section.on{display:block}
h2{margin:6px 0 4px;font-size:26px} h3{margin:0 0 12px;font-size:18px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-2)}
.btn.primary{background:var(--accent)} .btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)} .btn.ghost:hover{background:#efece4}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid #f1c4c4}
.btn.big{font-size:20px;padding:16px 28px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus{outline:2px solid var(--navy);outline-offset:0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-grid;place-items:center;color:#fff;font-weight:800;vertical-align:middle;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
/* Play */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tile{background:#fff;border:3px solid transparent;border-radius:16px;padding:16px 10px 12px;text-align:center;cursor:pointer;box-shadow:var(--shadow);position:relative;transition:transform .08s,border-color .1s;user-select:none}
.tile:hover{transform:translateY(-2px);border-color:#d6d1c4}
.tile .nm{font-weight:700;margin-top:8px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mm{color:var(--muted);font-size:13px}
.tile.win{border-color:var(--gold);background:#fffbea}
.tile.lose{border-color:var(--muted);background:#f1f1f1}
.tile .tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:1px}
.tile.win .tag{background:var(--gold);color:#3a2c00}
.tile.lose .tag{background:var(--muted);color:#fff}
.tile.add{border:3px dashed #cfc9bb;box-shadow:none;background:transparent;color:var(--muted);display:grid;place-items:center;min-height:150px;font-weight:700}
.steps{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.step{padding:6px 14px;border-radius:999px;background:#e9e5db;color:var(--muted);font-weight:700;font-size:14px}
.step.on{background:var(--navy);color:#fff} .step.done{background:#d7eedd;color:var(--green)}
.confirm{position:sticky;bottom:14px;margin-top:22px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(11,31,75,.22);padding:18px 20px;border:2px solid var(--navy)}
.vs{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.vs .side{display:flex;align-items:center;gap:12px}
.vs .side .n{font-weight:800;font-size:19px}
.vs .x{font-weight:900;color:var(--accent);font-size:22px}
.delta{font-weight:800;font-size:14px;padding:2px 8px;border-radius:999px}
.up{color:var(--green);background:#e3f5ea} .down{color:var(--red);background:#fbe6e6}
.opt{margin:14px auto 0;max-width:520px;border:1.5px dashed #cfc9bb;border-radius:12px;padding:8px 14px;background:#faf9f5}
.opt summary{cursor:pointer;font-weight:700;color:var(--muted);list-style:none}
.opt summary::-webkit-details-marker{display:none}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:#e9e5db;color:var(--muted);padding:2px 8px;border-radius:999px;margin-left:6px}
.scorerow{display:flex;align-items:center;gap:10px;margin-top:10px}
.scorerow input{width:90px;text-align:center;font-size:20px;font-weight:700}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* Dashboard */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.metric{background:var(--navy);color:#fff;border-radius:var(--radius);padding:14px 18px}
.metric .v{font-size:30px;font-weight:800} .metric .l{opacity:.75;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.hlc{background:#fff;border-radius:var(--radius);padding:14px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;cursor:pointer}
.hlc .e{font-size:28px}
.hlc .t{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.hlc .b{font-weight:800;font-size:16px} .hlc .s{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#faf8f3}
.rank{font-weight:800;font-size:18px;width:40px;text-align:center}
.pl{display:flex;align-items:center;gap:10px;font-weight:700}
.mmr{font-weight:800;font-size:18px}
.prov{font-size:10px;font-weight:800;background:#e9e5db;color:var(--muted);padding:2px 6px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase}
.form{display:flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
.form i.W{background:var(--green)} .form i.L{background:var(--red)}
.streak{font-weight:800;white-space:nowrap}
.streak.w{color:var(--green)} .streak.l{color:var(--cold)}
.tblwrap{overflow-x:auto}
.mu{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.mu select{flex:1}
.mures{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.mures .pn{font-weight:800;font-size:17px;margin-top:6px}
.probbar{height:14px;border-radius:999px;overflow:hidden;display:flex;margin:14px 0 6px;background:#eee}
.probbar div{height:100%}
.outc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.outc div{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.h2h{font-size:13px}
.h2h td,.h2h th{text-align:center;padding:6px;border:1px solid var(--line)}
.h2h td.self{background:#eee}
.h2h td.pos{background:#e3f5ea} .h2h td.neg{background:#fbe6e6}
.recent li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent ul{list-style:none;padding:0;margin:0}
.chartbox{position:relative;height:320px}
.seg{display:inline-flex;background:#efece4;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{color:var(--text)}
.chip .sw{width:10px;height:10px;border-radius:50%}
.linkbtn{background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;padding:2px 4px}
.tpill{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tcard{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:transform .08s}
.tcard:hover{transform:translateY(-2px)}
.tcard .tn{font-weight:800;font-size:19px;margin:10px 0 2px}
.tcard .tl{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.typepick .tp{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.typepick .tp.on{border-color:var(--accent);background:#fff5f6}
.pchecks{display:flex;flex-wrap:wrap;gap:6px}
.pcheck{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:14px;font-weight:600;cursor:pointer;background:#fff}
.pcheck input{width:auto;margin:0 2px 0 4px}
.pcheck:has(input:checked){border-color:var(--navy);background:#eef2fa}
.small-tiles{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.small-tiles .tile{padding:12px 6px 8px}
.champ{display:flex;align-items:center;gap:16px;margin:16px 0;padding:16px 20px;border-radius:16px;background:linear-gradient(135deg,#F2B705,#e09b00);color:#2b1f00}
.bracket{display:flex;gap:18px;overflow-x:auto;padding:10px 2px 16px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:210px}
.bhead{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center}
.bm{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.bm.live{border-color:var(--navy)}
.bp{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.bp:last-of-type{border-bottom:0}
.bp .bnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp .seed{font-size:11px;color:var(--muted);width:16px;text-align:right}
.bp .bs{font-weight:800}
.bp.click{cursor:pointer} .bp.click:hover{background:#fffbea}
.bp.win{background:#fffbea;font-weight:800} .bp.lose{opacity:.45}
.bp.empty{color:var(--muted);font-style:italic;font-weight:400}
.bundo{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:11px;border:0;background:#f1eee6;border-radius:6px;padding:2px 6px;cursor:pointer;opacity:0}
.bm:hover .bundo{opacity:1}
.champbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;text-align:center}
.recas{max-width:560px;margin:14px auto 0;background:#f5f7fc;border:1.5px solid #d5ddef;border-radius:12px;padding:10px 14px}
.recas .ro{display:flex;align-items:center;gap:8px;font-weight:500;margin:4px 0;padding:6px 8px;border-radius:8px;cursor:pointer}
.recas .ro.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.recas .ro input{width:auto;margin:0}
.trophies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trophy{background:#fff7d9;border:1px solid #f0d58a;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.livebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.livebar a{background:#eef2fa;border:1px solid #d5ddef;color:var(--navy);text-decoration:none;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
@media(max-width:600px){.typepick{grid-template-columns:1fr}}
.hstoggle{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;cursor:pointer;margin:0}
.hstoggle input{width:18px;height:18px;margin:0;accent-color:var(--navy)}
.hstoggle.on{border-color:var(--navy);background:#eef2fa;color:var(--navy)}
.hsbox{max-width:560px;margin:12px auto 0;background:#eef2fa;border:1.5px solid #c9d4ec;border-radius:12px;padding:10px 14px;text-align:center}
.hsbox input{width:70px;display:inline-block;text-align:center;font-weight:800;font-size:18px;padding:4px 6px}
.hstag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eef2fa;color:var(--navy);margin-left:6px;white-space:nowrap}
.hsline{margin-top:12px;padding:8px 12px;background:#eef2fa;border-radius:10px;font-size:14px}
.teamtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#e6ecf7;color:var(--navy)}
/* Players */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;text-align:center;cursor:pointer;position:relative}
.pc.inactive{opacity:.55}
.pc .n{font-weight:800;font-size:18px;margin-top:10px}
.pc .tg{color:var(--muted);font-size:13px;font-style:italic;min-height:18px}
.pc .st{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:13px;color:var(--muted)}
.pc .st b{display:block;color:var(--text);font-size:17px}
.pc .edit{position:absolute;top:10px;right:10px;background:#f1eee6;border:0;border-radius:8px;padding:5px 9px;cursor:pointer}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(11,31,75,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
.mclose{position:absolute;top:12px;right:14px;background:#f1eee6;border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0}
.pstats div{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.pstats b{display:block;font-size:20px}
.pstats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.ts{background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;font-weight:600}
.ts button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.ts.err{background:var(--red)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
code{background:#f1eee6;padding:2px 6px;border-radius:6px}

/* =========================================================
   VISUAL THEME – "Sörred World Tour"
   ========================================================= */
:root{
  --navy:#0F2E3D; --navy-2:#174A60; --accent:#FF6A2B; --accent-2:#E8551A;
  --gold:#F5B811; --green:#16A36A; --red:#E0484D; --cold:#3B8FD9;
  --bg:#EEF2F4; --card:#fff; --text:#13222c; --muted:#66757f; --line:#e1e7eb;
  --radius:18px; --shadow:0 1px 2px rgba(15,46,61,.06),0 6px 20px rgba(15,46,61,.07);
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 85% -100px,#d9e8ee 0,transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
h2,h3,.brand,.metric .v,.mmr,.tn,.pod-name,.pod-mmr{font-family:var(--display)}
h2{font-size:32px;font-weight:800;letter-spacing:-.5px} h3{font-size:19px;font-weight:700}
/* header */
header{background:linear-gradient(115deg,#0B2431 0%,#0F2E3D 45%,#17506A 100%);position:sticky;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.hwrap{padding:14px 24px;position:relative;z-index:1}
.brand{font-size:22px;font-weight:800;gap:14px;line-height:1.1}
.brand small{font-family:"Inter",sans-serif;font-size:11px;letter-spacing:3px;opacity:.65;margin-bottom:3px}
.brand-hl{color:var(--accent)}
.brand .dot{width:46px;height:46px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);position:relative}
.brand .dot .ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#ffd9c7 30%,var(--accent) 75%);box-shadow:0 2px 8px rgba(255,106,43,.6);animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
nav button{font-size:14.5px;padding:10px 16px;opacity:.8;transition:background .15s,opacity .15s}
nav button.on{background:var(--accent);box-shadow:0 4px 14px rgba(255,106,43,.4)}
#gear{width:42px;height:42px}
main{padding:26px 24px 80px}
/* cards & buttons */
.card{border:0;border-radius:var(--radius);padding:22px}
.btn{border-radius:12px;transition:transform .08s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#FF7A3D,var(--accent-2));box-shadow:0 6px 18px rgba(255,106,43,.35)}
.btn.primary:hover{background:linear-gradient(135deg,#FF6A2B,#d94c12)}
.btn.big{font-size:21px;padding:17px 34px;border-radius:16px}
input,select{border-radius:12px;border-color:#d8e0e5}
/* hero */
.hero{background:linear-gradient(120deg,#0F2E3D,#17506A);color:#fff;border-radius:24px;padding:26px 28px 20px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 20%,rgba(255,106,43,.35),transparent 35%);pointer-events:none}
.hero>*{position:relative}
.hero h2{margin:4px 0 6px;font-size:38px}
.hero .sub{color:rgba(255,255,255,.75)}
.hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.hero .step{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.hero .step.on{background:var(--accent);color:#fff}
.hero .step.done{background:rgba(22,163,106,.25);color:#7ff0bd}
.steps{margin-bottom:0}
/* player tiles */
.tiles{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px}
.tile{border-radius:22px;padding:22px 12px 16px;border:3px solid transparent;transition:transform .12s,box-shadow .12s,border-color .12s}
.tile:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,46,61,.14)}
.tile .nm{font-size:17px;margin-top:12px}
.tile .mm{font-weight:600}
.tile.win{border-color:var(--gold);background:linear-gradient(180deg,#fff8de,#fff);box-shadow:0 10px 30px rgba(245,184,17,.35)}
.tile.lose{border-color:#b9c3ca;background:#f3f5f7;filter:grayscale(.5)}
.tile .tag{top:-13px;font-size:12px;padding:4px 12px}
.tile.add{min-height:200px;border-radius:22px}
.small-tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.av{border:3px solid #fff;box-shadow:0 3px 10px rgba(15,46,61,.18)}
.confirm{border:0;border-radius:24px;box-shadow:0 18px 50px rgba(15,46,61,.28);padding:24px}
.vs .side .n{font-size:21px}
.vs .x{font-family:var(--display);font-size:24px}
/* metrics */
.metric{background:linear-gradient(135deg,#0F2E3D,#17506A);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.metric::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,106,43,.18)}
.metric .v{font-size:34px}
.hlc{border:0;border-radius:var(--radius);padding:16px;transition:transform .1s}
.hlc:hover{transform:translateY(-2px)}
/* podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:6px 0 26px;flex-wrap:wrap}
.pod{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:220px;transition:transform .12s}
.pod:hover{transform:translateY(-4px)}
.pod-av{position:relative}
.pod.p1 .av{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,184,17,.35),0 10px 30px rgba(245,184,17,.45)}
.pod.p2 .av{border-color:#C7D0D6} .pod.p3 .av{border-color:#D99A6C}
.pod-medal{position:absolute;bottom:-4px;right:-2px;font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.pod-name{font-weight:800;font-size:19px;margin-top:10px;text-align:center}
.pod-mmr{font-weight:900;font-size:26px;color:var(--navy)} .pod-mmr span{font-size:13px;color:var(--muted);font-weight:600}
.pod-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pod-block{margin-top:12px;width:100%;border-radius:16px 16px 6px 6px;color:#fff;font-family:var(--display);font-weight:900;font-size:34px;display:grid;place-items:center;box-shadow:var(--shadow)}
.pod.p1 .pod-block{height:110px;background:linear-gradient(180deg,#F8C93A,#E3A300)}
.pod.p2 .pod-block{height:80px;background:linear-gradient(180deg,#BCC6CD,#95A2AB)}
.pod.p3 .pod-block{height:60px;background:linear-gradient(180deg,#E3A57A,#C47A47)}
@media(max-width:720px){.pod{width:30%;min-width:100px}.pod .av{width:84px!important;height:84px!important}.pod.p1 .av{width:100px!important;height:100px!important}.pod-name{font-size:15px}.pod-mmr{font-size:20px}}
/* tables */
th{font-size:11.5px;border-bottom:2px solid var(--line)}
td{padding:11px 8px}
.pl{gap:12px}
/* player cards */
.pcards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.pc{border:0;border-radius:22px;padding:26px 18px 20px;transition:transform .12s,box-shadow .12s;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;background:linear-gradient(120deg,#0F2E3D,#17506A)}
.pc>*{position:relative}
.pc:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(15,46,61,.16)}
.pc .n{font-size:20px;margin-top:12px;font-family:var(--display)}
.pc .edit{background:rgba(255,255,255,.9);z-index:2;position:absolute}
.pc .st{gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* modal */
.mbox{border-radius:24px;padding:28px;max-width:740px}
.modal{backdrop-filter:blur(3px)}
/* tournaments */
.tcard{border:0;border-radius:var(--radius);border-top:4px solid var(--accent)}
.champ{border-radius:20px;box-shadow:0 10px 30px rgba(245,184,17,.35)}
.bm{border-radius:14px}
/* toast */
.ts{border-radius:14px;padding:14px 20px;background:#0F2E3D}
/* footer */
.foot{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:0 0 30px}

main.anim .pod{animation:slideUp .6s cubic-bezier(.2,.8,.2,1) both} main.anim .pod.p1{animation-delay:.15s} main.anim .pod.p3{animation-delay:.3s}
.tile.just{animation:pop .35s ease}
.tile:active{transform:scale(.97)}
.tile .av{transition:transform .2s} .tile:hover .av{transform:scale(1.05)}
.confirm{animation:slideUp .35s cubic-bezier(.2,.8,.2,1)}
.modal:not(.hidden){animation:fadeIn .2s} .modal:not(.hidden) .mbox{animation:modalIn .28s cubic-bezier(.2,.8,.2,1)}
.ts{animation:toastIn .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.ts .tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform-origin:left;animation:bar linear forwards}
.streak.hot{display:inline-block}
.streak.hot .fl{display:inline-block;animation:flicker 1.2s ease-in-out infinite}
.wr{display:flex;align-items:center;gap:8px;min-width:96px}
.wr .wrb{flex:1;height:7px;border-radius:99px;background:#e8edf0;overflow:hidden}
.wr .wrb span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.wr small{font-weight:700;width:34px;text-align:right}
tr.r1 td{background:linear-gradient(90deg,rgba(245,184,17,.13),transparent 70%)}
tr.r2 td{background:linear-gradient(90deg,rgba(160,175,185,.15),transparent 70%)}
tr.r3 td{background:linear-gradient(90deg,rgba(205,127,72,.13),transparent 70%)}
nav button{position:relative}
.metric .v{font-variant-numeric:tabular-nums}
/* skeleton */
.sk{background:linear-gradient(90deg,#e4e9ec 0,#f3f6f7 40%,#e4e9ec 80%);background-size:800px 100%;animation:shimmer 1.3s linear infinite;border-radius:14px}
.sk-hero{height:150px;border-radius:24px;margin-bottom:22px}
.sk-tile{height:200px;border-radius:22px}
/* celebration */
.cel{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(23,80,106,.88),rgba(8,24,33,.94));animation:fadeIn .25s;padding:20px}
.cel canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;text-align:center;color:#fff;max-width:520px;width:100%;animation:celIn .6s cubic-bezier(.2,.8,.2,1)}
.cel-eyebrow{font-size:13px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.cel-title{font-family:var(--display);font-size:44px;font-weight:900;letter-spacing:-1px;margin:4px 0 18px;line-height:1.05}
.cel-av{display:inline-block;border-radius:50%;animation:ring 1.4s ease-out .4s 2}
.cel-av .av{border:5px solid var(--gold)}
.cel-name{font-family:var(--display);font-size:30px;font-weight:800;margin-top:14px}
.cel-vs{display:flex;align-items:center;justify-content:center;gap:8px;opacity:.75;margin-top:4px}
.cel-mmr{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.cel-chip{font-family:var(--display);font-weight:900;font-size:26px;padding:6px 16px;border-radius:14px;font-variant-numeric:tabular-nums}
.cel-chip.up{background:rgba(22,163,106,.25);color:#7ff0bd}
.cel-chip.down{background:rgba(224,72,77,.22);color:#ffb3b5;font-size:18px;align-self:center}
.cel-chip.neutral{background:rgba(255,255,255,.12);color:#fff;font-size:16px}
.cel-calls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 22px}
.cel-calls span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;animation:chipIn .4s both}
.cel-calls span:nth-child(2){animation-delay:.12s} .cel-calls span:nth-child(3){animation-delay:.24s}
.cel-btns{display:flex;gap:10px;justify-content:center}
.cel-btns .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)} .cel-btns .btn.ghost:hover{background:rgba(255,255,255,.1)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* quote of the day */
@keyframes qIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qotd{position:relative;margin:26px auto 0;max-width:760px;padding:22px 64px 20px 28px;border-radius:20px;background:#fff;box-shadow:var(--shadow);border-left:5px solid var(--accent);cursor:pointer;animation:qIn .35s ease both;transition:box-shadow .15s,opacity .18s,transform .18s}
.qotd:hover{box-shadow:0 10px 28px rgba(15,46,61,.12)}
.qotd.flip{opacity:0;transform:translateY(-6px)}
.qotd-label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qotd-q{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.4;color:var(--navy)}
.qotd-who{margin-top:8px;font-size:13px;color:var(--muted);font-style:italic}
.qotd-next{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef2f4;color:var(--navy);font-size:16px;transition:transform .3s}
.qotd:hover .qotd-next{transform:translateY(-50%) rotate(180deg)}
@media(max-width:600px){.qotd-q{font-size:17px}}

/* picture gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;max-height:300px;overflow-y:auto;margin:14px 0 4px;padding:12px;background:#f4f7f8;border-radius:16px}
.gal-i{position:relative;padding:0;border:3px solid transparent;border-radius:50%;background:#fff;cursor:pointer;aspect-ratio:1;overflow:hidden;transition:transform .12s,border-color .12s;box-shadow:0 2px 6px rgba(15,46,61,.12)}
.gal-i:hover{transform:scale(1.08)}
.gal-i.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,106,43,.3)}
.gal-i img{width:100%;height:100%;object-fit:cover;display:block}
.gal-t{position:absolute;right:2px;bottom:2px;width:18px;height:18px;border-radius:50%;background:rgba(15,46,61,.75);color:#fff;font-size:10px;display:grid;place-items:center}

.req{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:#fff0e8;color:var(--accent-2);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
input.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,72,77,.15)}
.photo-pick.bad{padding:10px;border-radius:14px;outline:2px solid var(--red);background:#fff5f5}

.podnote{text-align:center;color:var(--muted);font-size:13px;margin:-12px 0 22px}
tr.lbdiv td{background:#f4f7f8;color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:8px 10px}
tr.unr td{opacity:.75}
/* ---------- Spin the wheel + How MMR works ---------- */
.spinbox{display:block;width:100%;max-width:520px;margin:14px auto 0;border:2px dashed var(--accent);border-radius:14px;background:#fff6f1;color:var(--navy);font-weight:800;font-size:17px;padding:12px 16px;cursor:pointer;font-family:inherit;text-align:center}
.spinbox:hover{background:#ffeadf}
.spinbox small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px}
.wheel-wrap{text-align:center}
.wheel-wrap{text-align:center;max-width:680px;margin:0 auto}
.wheel{position:relative;width:min(520px,86vw);max-width:520px;margin:18px auto 10px;background:radial-gradient(circle, #103b4e 0%, #081720 100%);border-radius:50%;padding:12px;box-shadow:inset 0 0 0 6px #fff, 0 16px 44px rgba(0,0,0,.4)}
.wheel svg{width:100%;height:auto;display:block;transition:transform 4.6s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 10px 24px rgba(0,0,0,.28))}
.wheel-ptr{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:56px;height:72px;z-index:10;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));pointer-events:none}
.wheel-wrap.spinning .mclose{display:none}
.wheel-res{font-family:var(--display);font-size:26px;font-weight:900;color:var(--navy);min-height:42px;margin-top:14px}
.wheel-odds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.wheel-odds span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.spintag{background:#fff1e9;color:#c2410c}
.bountytag{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.bounty-card{background:linear-gradient(135deg,#781d1d,#991b1b);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(153,27,27,.3);border:2px solid #ef4444}
.bounty-alert{background:#fef2f2;border:1.5px dashed #ef4444;border-radius:12px;padding:10px 14px;margin-top:10px;text-align:center;color:#991b1b;font-weight:700}
.rules{margin:0;padding-left:20px;line-height:1.6} .rules li{margin:5px 0}
.mmrtbl{width:100%;border-collapse:collapse;font-size:14px} .mmrtbl th,.mmrtbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.mmrtbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* ---------- The Sörred Gazette (Vintage Newspaper) ---------- */
.gazette-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.gazette-paper{background:#fcfbf7;color:#181818;font-family:Georgia,"Times New Roman",Times,serif;padding:36px 42px;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.12);border:1px solid #dcd7ca;max-width:960px;margin:0 auto}
.gazette-top-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-top:1px solid #181818;border-bottom:1px solid #181818;padding:5px 0;margin-bottom:12px;color:#333}

<script>
/* =========================================================
   CONFIG – paste your Supabase project URL + publishable/anon key
   here so everyone who opens the file is connected automatically.
   (Leave empty to run in local demo mode.)
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: "https://jlpqbojaakoktmbpawwg.supabase.co",
  SUPABASE_KEY: "sb_publishable_QhK_2u47wB_05BxO0BzVtw_6jP9AJKd"
};

/* ---------- MMR (Elo) settings ---------- */
const START_MMR = 1000;
function kFactor(games){            // adaptive K (aggressive): newcomers move fastest
  if (games < 5)  return 160;        // first 5 games
  if (games < 15) return 128;
  return 96;                        // settled players
}
const PROVISIONAL = 1;              // games before you're "ranked"

/* ---------- Head start (games to 11, win by 2) ----------
   The lower-rated player starts with a few points so the game is ~50/50.
   HEADSTART_RATED = false → head-start games don't change MMR (just for fun).
   Set to true later → NEW head-start games count for MMR as a 50/50 game
   (old games keep the setting they were saved with).                       */
const HEADSTART_RATED = false;

/* ---------- Leader Bounty on hot streaks ----------
   Feature flag: can be toggled in Settings or set to false here to disable completely. */
let BOUNTY_FEATURE = (typeof localStorage !== 'undefined' && localStorage.getItem('pp_bounty') !== 'false');
/* ---------- Discreet Mode (Office Mode) ----------
   Default YES: Hides total matches played and raw W-L counts; displays Win % and streaks instead.
   Requires password ('hampus123' or 'edp123') to disable. */
let DISCREET_MODE = (typeof localStorage !== 'undefined' && localStorage.getItem('pp_discreet') === 'false') ? false : true;
const BOUNTY_STREAK_MIN = 5;       // win streak needed to trigger a bounty
const BOUNTY_BONUS = 100;          // bonus MMR awarded for breaking the streak

/* ---------- Spin the wheel ----------
   weight = chance AND slice size (equal weights = equal chance).
   Add/remove outcomes here. Each id must also be allowed by the
   check constraint on matches.spin in supabase-setup.sql.          */
const WHEEL = [
  { id:'5x',      label:'5× MMR MEGA WIN',             short:'5× MMR',    emoji:'💥', color:'#E5A000', weight:8, jackpot:true },
  { id:'triple',  label:'Triple points for the winner', short:'3× points', emoji:'🔥', color:'#FF6A2B', weight:16 },
  { id:'double',  label:'Double or Nothing',            short:'Double/Bust', emoji:'💣', color:'#D926A9', weight:12, gamble:true },
  { id:'reverse', label:'The Uno Reverse (Steal Win)', short:'Uno Reverse', emoji:'🔄', color:'#10B981', weight:6, reverse:true },
  { id:'split',   label:'Generous King (Split +25)',   short:'Split +25', emoji:'🤝', color:'#3B82F6', weight:10, split:true },
  { id:'noloss',  label:'No points lost for the loser', short:'No loss',   emoji:'🛡️', color:'#17506A', weight:16 },
  { id:'rematch', label:'Rematch (draw)',               short:'Rematch',   emoji:'🔁', color:'#16A36A', weight:16, draw:true },
  { id:'decider', label:'One deciding ball (draw)',     short:'One ball',  emoji:'🎯', color:'#7C5CFF', weight:16, draw:true },
];
const wheelItem = id => WHEEL.find(x=>x.id===id);
const isDrawSpin = id => !!(wheelItem(id)?.draw);
const GAME_TO = 11;
function expected(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }
function eloDeltas(wMmr,lMmr,wGames,lGames,even=false){
  const pW = even ? 0.5 : expected(wMmr,lMmr);
  // Zero-sum: the winner gains exactly what the loser drops.
  // K is the average of both players' K, so a newcomer can't swing a settled player wildly.
  const k = (kFactor(wGames)+kFactor(lGames))/2;
  const d = Math.max(1, Math.round(k*(1-pW)));
  return { pW, dW: d, dL: -d };
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
const fmtDate = d => new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const pct = x => Math.round(x*100)+'%';
const sgn = n => (n>0?'+':'')+n;
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function initials(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avatar(p,size=44){
  if(!p) return '';
  if(p.photo) return `<img class="av" style="width:${size}px;height:${size}px" src="${esc(p.photo)}" alt="">`;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:hsl(${hash(p.id)%360} 50% 42%)">${esc(initials(p.name))}</span>`;
}
const P = id => state.players.find(p=>p.id===id);

/* Head-start maths: convert the Elo win chance into a per-point win chance,
   then find the head start that makes a game to 11 (win by 2) closest to 50/50. */
function gameWinProb(p,a,b){              // P(player A wins) from score a–b, per-point win prob p
  const q=p*p/(p*p+(1-p)*(1-p)), memo={};
  const f=(x,y)=>{
    if(x>=GAME_TO&&x-y>=2) return 1; if(y>=GAME_TO&&y-x>=2) return 0;
    if(x>=GAME_TO-1&&y>=GAME_TO-1){ const d=x-y; return d===0?q:d===1?p+(1-p)*q:p*q; }
    const k=x+','+y; if(k in memo) return memo[k];
    return memo[k]=p*f(x+1,y)+(1-p)*f(x,y+1);
  };
  return f(a,b);
}
const _hsCache={};
function headStartPts(gap){                // gap = MMR difference (>=0)
  gap=Math.round(Math.abs(gap)); if(gap in _hsCache) return _hsCache[gap];
  const E=expected(gap,0); let lo=0.5, hi=0.995;
  for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(gameWinProb(m,0,0)<E) lo=m; else hi=m; }
  let best=0, bd=Infinity, bp=E;
  for(let h=0;h<GAME_TO;h++){ const pr=gameWinProb(lo,0,h), d=Math.abs(pr-0.5); if(d<bd-1e-9){bd=d;best=h;bp=pr;} }
  return _hsCache[gap]={pts:best,favNoHS:E,favWithHS:bp};
}
function headStart(aId,bId){
  const a=state.R[aId]?.mmr??START_MMR, b=state.R[bId]?.mmr??START_MMR;
  const fav=a>=b?aId:bId, dog=fav===aId?bId:aId, r=headStartPts(a-b);
  return {fav,dog,...r};
}
function hsText(aId,bId){
  const h=headStart(aId,bId);
  if(!h.pts) return `🎯 <b>Head start:</b> none needed, this is already a close match.`;
  return `🎯 <b>Head start:</b> ${esc(P(h.dog).name)} starts at <b>${h.pts}–0</b> <span class="muted small">(${esc(P(h.fav).name.split(' ')[0])} goes from ${pct(h.favNoHS)} to ~${pct(h.favWithHS)} to win)</span>`;
}
function hsTag(e){
  if(!e.hs) return '';
  const who=e.head_start_player&&P(e.head_start_player);
  return `<span class="hstag" title="Head-start game${e.unrated?' – MMR unchanged':''}">🎯 ${who?esc(who.name.split(' ')[0])+' +'+e.head_start:'even'}${e.unrated?' · no MMR':''}</span>`;
}
function bountyTag(e){
  return (BOUNTY_FEATURE && e.bounty) ? `<span class="hstag bountytag" title="Bounty claimed! +${e.bounty} bonus MMR">🎯 +${e.bounty} Bounty</span>` : '';
}
function spinTag(e){
  if(!e.spin) return ''; const x=wheelItem(e.spin);
  let label = x ? x.emoji + ' ' + esc(x.short) : esc(e.spin);
  if(e.spin==='double_win') label = '💣 4× Double Win!';
  else if(e.spin==='double_bust') label = '💣 Double Bust (0)';
  else if(e.spin==='double_take') label = '💣 Took Normal';
  else if(e.spin==='reverse') label = '🔄 Uno Reverse!';
  else if(e.spin==='split') label = '🤝 Split +25';
  return `<span class="hstag spintag" title="Spin the wheel${e.draw?' – draw, MMR unchanged':''}">🎡 ${label}${e.draw?' · draw':''}</span>`;
}
const dWHtml=e=>e.unrated?'<span class="muted small">–</span>':`<span class="delta up">${sgn(e.dW)}</span>`;
const dLHtml=e=>e.unrated?'<span class="muted small">–</span>':`<span class="delta down">${e.dL}</span>`;

/* =========================================================
   STORAGE: Supabase (REST) or local demo
   ========================================================= */
function getCfg(){
  try{ const s=JSON.parse(localStorage.getItem('pp_cfg')||'null'); if(s&&s.url&&s.key) return s; }catch(e){}
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) return {url:CONFIG.SUPABASE_URL,key:CONFIG.SUPABASE_KEY,fromFile:true};
  return null;
}
function sbStore(cfg){
  const base = cfg.url.trim().replace(/\/+$/,'') + '/rest/v1/';
  const h = { apikey: cfg.key.trim(), 'Content-Type':'application/json' };
  if (cfg.key.trim().startsWith('eyJ')) h.Authorization = 'Bearer ' + cfg.key.trim(); // legacy anon JWT
  async function req(path,opt={}){
    const r = await fetch(base+path,{...opt,headers:{...h,...(opt.headers||{})}});
    const t = await r.text();
    if(!r.ok){ let msg=t; try{msg=JSON.parse(t).message||t;}catch(e){} throw new Error(msg||r.statusText); }
    return t ? JSON.parse(t) : null;
  }
  async function all(path){            // page through >1000 rows
    let out=[], off=0;
    while(true){ const rows=await req(`${path}&limit=1000&offset=${off}`); out=out.concat(rows); if(rows.length<1000) break; off+=1000; }
    return out;
  }
  const rep = {Prefer:'return=representation'};
  return { mode:'supabase',
    async load(){ const [players,matches,t]=await Promise.all([all('players?select=*&order=created_at.asc'),all('matches?select=*&order=played_at.asc'),this.loadT()]); return {players,matches,...t}; },
    addPlayer: p => req('players',{method:'POST',headers:rep,body:JSON.stringify(p)}).then(r=>r[0]),
    updatePlayer: (id,p) => req('players?id=eq.'+id,{method:'PATCH',headers:rep,body:JSON.stringify(p)}).then(r=>r[0]),
    deletePlayer: id => req('players?id=eq.'+id,{method:'DELETE'}),
    addMatch: m => req('matches',{method:'POST',headers:rep,body:JSON.stringify(m)}).then(r=>r[0]),
    deleteMatch: id => req('matches?id=eq.'+id,{method:'DELETE'}),
    async loadT(){
      try{ const [tournaments,tplayers,tmatches]=await Promise.all([all('tournaments?select=*&order=created_at.asc'),all('tournament_players?select=*&order=joined_at.asc'),all('tournament_matches?select=*&order=played_at.asc')]);
        return {tournaments,tplayers,tmatches,tMissing:false}; }
      catch(e){ if(/PGRST205|schema cache|does not exist/i.test(e.message)) return {tournaments:[],tplayers:[],tmatches:[],tMissing:true}; throw e; }
    },
    tAdd: (table,row) => req(table,{method:'POST',headers:rep,body:JSON.stringify(row)}),
    tDel: (table,f) => req(table+'?'+Object.entries(f).map(([k,v])=>k+'=eq.'+v).join('&'),{method:'DELETE'}),
    tUpdate: (table,f,patch) => req(table+'?'+Object.entries(f).map(([k,v])=>k+'=eq.'+v).join('&'),{method:'PATCH',headers:rep,body:JSON.stringify(patch)}),
  };
}
const TKEY={tournaments:'tournaments',tournament_players:'tplayers',tournament_matches:'tmatches'};
function demoStore(){
  const KEY='pp_demo_v5';
  const read=()=>{ let d=null; try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){} if(!d){d=seedDemo();localStorage.setItem(KEY,JSON.stringify(d));} return d; };
  const write=d=>localStorage.setItem(KEY,JSON.stringify(d));
  return { mode:'demo',
    async load(){ const d=read(); return {tournaments:[],tplayers:[],tmatches:[],...d,tMissing:false}; },
    async addPlayer(p){ const d=read(); const n={id:uid(),active:true,created_at:new Date().toISOString(),...p}; d.players.push(n); write(d); return n; },
    async updatePlayer(id,p){ const d=read(); const x=d.players.find(q=>q.id===id); Object.assign(x,p); write(d); return x; },
    async deletePlayer(id){ const d=read(); d.players=d.players.filter(q=>q.id!==id); write(d); },
    async addMatch(m){ const d=read(); const n={id:uid(),played_at:new Date().toISOString(),...m}; d.matches.push(n); write(d); return n; },
    async deleteMatch(id){ const d=read(); d.matches=d.matches.filter(q=>q.id!==id); write(d); },
    async tAdd(table,row){ const d=read(); const k=TKEY[table]; d[k]=d[k]||[]; const rows=(Array.isArray(row)?row:[row]).map(r=>({...(table==='tournament_players'?{joined_at:new Date().toISOString()}:{id:uid(),created_at:new Date().toISOString(),played_at:new Date().toISOString()}),...r}));
      for(const r of rows){ if(table==='tournament_players'&&d[k].some(x=>x.tournament_id===r.tournament_id&&x.player_id===r.player_id)) throw new Error('Already joined');
        if(table==='tournament_matches'&&r.round!=null&&d[k].some(x=>x.tournament_id===r.tournament_id&&x.round===r.round&&x.slot===r.slot)) throw new Error('That match already has a result'); }
      d[k].push(...rows); write(d); return rows; },
    async tDel(table,f){ const d=read(); const k=TKEY[table]; const hit=x=>Object.entries(f).every(([a,b])=>x[a]===b);
      if(table==='tournaments'){ const ids=d.tournaments.filter(hit).map(x=>x.id); d.tplayers=(d.tplayers||[]).filter(x=>!ids.includes(x.tournament_id)); d.tmatches=(d.tmatches||[]).filter(x=>!ids.includes(x.tournament_id)); }
      d[k]=(d[k]||[]).filter(x=>!hit(x)); write(d); },
    async tUpdate(table,f,patch){ const d=read(); const k=TKEY[table]; (d[k]||[]).filter(x=>Object.entries(f).every(([a,b])=>x[a]===b)).forEach(x=>Object.assign(x,patch)); write(d); },
    reset(){ localStorage.removeItem(KEY); },
    clear(){ write({players:[],matches:[],tournaments:[],tplayers:[],tmatches:[]}); }
  };
}
function seedDemo(){
  let s=7; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const names=[['Anna Lind','Spin doctor',1150],['Björn Ek','All gas, no brakes',1080],['Clara Berg','Backhand of doom',1120],
               ['David Holm','Defensive wall',980],['Elin Sjö','Comeback queen',1040],['Filip Nord','Still warming up',900],['Greta Ås','Lightning reflexes',1060],['Hugo Strand','Never gives up a point',1010]];
  const players=names.map(([name,tagline,sk],i)=>({id:uid(),name,tagline,team:i<4?'Office':'Warehouse',photo:null,active:true,created_at:new Date(Date.now()-40*864e5+i).toISOString(),_sk:sk}));
  const matches=[]; const now=Date.now();
  for(let i=0;i<90;i++){
    const n=players.length; const a=players[Math.floor(rnd()*n)]; let b; do{b=players[Math.floor(rnd()*n)];}while(b===a);
    const aw = rnd() < expected(a._sk,b._sk);
    const w=aw?a:b, l=aw?b:a; const withScore=rnd()<.6; const ls=Math.floor(rnd()*10);
    matches.push({id:uid(),winner_id:w.id,loser_id:l.id,winner_score:withScore?11:null,loser_score:withScore?ls:null,
      played_at:new Date(now-(90-i)*0.7*864e5).toISOString()});
  }
  for(let i=0;i<10;i++){   // sample head-start games (MMR unchanged)
    const n=players.length; const a=players[Math.floor(rnd()*n)]; let b; do{b=players[Math.floor(rnd()*n)];}while(b===a);
    const dog=a._sk<b._sk?a:b; const w=rnd()<.5?a:b, l=w===a?b:a;
    matches.push({id:uid(),winner_id:w.id,loser_id:l.id,winner_score:null,loser_score:null,head_start:1+Math.floor(rnd()*4),head_start_player:dog.id,head_start_rated:false,
      played_at:new Date(now-(10-i)*1.3*864e5-36e5).toISOString()});
  }
  players.forEach(p=>delete p._sk);
  // sample tournaments: a live monthly league + a knockout in progress
  const now2=new Date(), y=now2.getFullYear(), mo=now2.getMonth();
  const tl={id:uid(),name:now2.toLocaleString('en-US',{month:'long'})+' Cup '+y,kind:'league',period:'monthly',status:'active',
    start_date:ymd(new Date(y,mo,1)),end_date:ymd(new Date(y,mo+1,0)),settings:{win_pts:3,loss_pts:1,max_per_pair:3},created_at:new Date(y,mo,1).toISOString()};
  const tk={id:uid(),name:'Autumn Knockout',kind:'knockout',period:'knockout',status:'active',start_date:ymd(now2),
    settings:{seeding:'mmr',seeds:players.slice(0,6).map(p=>p.id)},created_at:now2.toISOString()};
  const tplayers=[...players.map(p=>({tournament_id:tl.id,player_id:p.id,joined_at:tl.created_at})),...players.slice(0,6).map(p=>({tournament_id:tk.id,player_id:p.id,joined_at:tk.created_at}))];
  const tmatches=[]; const days=Math.max(1,now2.getDate()-1);
  for(let i=0;i<14;i++){ const n=players.length; const a=players[Math.floor(rnd()*n)]; let b; do{b=players[Math.floor(rnd()*n)];}while(b===a);
    const w=rnd()<.5?a:b, l=w===a?b:a; tmatches.push({id:uid(),tournament_id:tl.id,winner_id:w.id,loser_id:l.id,round:null,slot:null,winner_score:null,loser_score:null,
      played_at:new Date(y,mo,1+Math.floor(i*days/14),12).toISOString()}); }

}

function setTeam(i){ teamFilter = i<0 ? '' : (teams()[i]||''); }

function compute(){
  const R={};
  state.players.forEach(p=>R[p.id]={mmr:START_MMR,peak:START_MMR,games:0,w:0,l:0,streak:0,bestW:0,bestL:0,form:[],pf:0,pa:0,scored:0,d7:0,series:[],hsW:0,hsL:0});
  const now=Date.now(), WEEK=7*864e5;
  const ms=[...state.matches].sort((a,b)=>new Date(a.played_at)-new Date(b.played_at));
  const E=[], h2h={};
  for(const m of ms){
    const W=R[m.winner_id], L=R[m.loser_id]; if(!W||!L) continue;
    const spin=m.spin||null;
    if(isDrawSpin(spin)){ E.push({...m,hs:false,draw:true,unrated:true,pW:.5,dW:0,dL:0,wBefore:W.mmr,lBefore:L.mmr,wAfter:W.mmr,lAfter:L.mmr,idx:E.length+1}); continue; }
    const isHS=m.head_start!=null, unrated=isHS&&!m.head_start_rated;
    if(isHS){ W.hsW++; L.hsL++; }
    if(unrated){ E.push({...m,hs:true,unrated:true,pW:.5,dW:0,dL:0,wBefore:W.mmr,lBefore:L.mmr,wAfter:W.mmr,lAfter:L.mmr,idx:E.length+1}); continue; }
    let {pW,dW,dL}=eloDeltas(W.mmr,L.mmr,W.games,L.games,isHS);
    if(spin==='5x') dW*=5;              // wheel: 5x MMR jackpot for winner
    if(spin==='triple') dW*=3;          // wheel: winner gets 3x
    if(spin==='noloss') dL=0;           // wheel: loser drops 0
    if(spin==='reverse'){ const tmp=dW; dW=dL; dL=tmp; } // uno reverse: winner drops, loser steals win!
    if(spin==='split'){ dW=25; dL=25; } // generous king: both gain +25
    if(spin==='double_win') dW*=4;      // gambled & won 4x!
    if(spin==='double_bust') dW=0;      // gambled & lost, 0 gain
    const hadBounty = BOUNTY_FEATURE && L.streak >= BOUNTY_STREAK_MIN;
    if(hadBounty && !isDrawSpin(spin)) dW += BOUNTY_BONUS;
    const e={...m,hs:isHS,pW,dW,dL,bounty:hadBounty?BOUNTY_BONUS:0,wBefore:W.mmr,lBefore:L.mmr,idx:E.length+1};
    W.mmr+=dW; L.mmr+=dL; W.games++; L.games++; W.w++; L.l++;
    W.peak=Math.max(W.peak,W.mmr);
    W.streak=W.streak>0?W.streak+1:1; L.streak=L.streak<0?L.streak-1:-1;
    W.bestW=Math.max(W.bestW,W.streak); L.bestL=Math.max(L.bestL,-L.streak);
    W.form.push('W'); L.form.push('L');
    if(m.winner_score!=null && m.loser_score!=null){
      W.pf+=m.winner_score; W.pa+=m.loser_score; W.scored++;
      L.pf+=m.loser_score; L.pa+=m.winner_score; L.scored++;
    }
    if(now-new Date(m.played_at)<WEEK){ W.d7+=dW; L.d7+=dL; }
    e.wAfter=W.mmr; e.lAfter=L.mmr;
    const k=m.winner_id+'|'+m.loser_id; h2h[k]=(h2h[k]||0)+1;
    const t=new Date(m.played_at).getTime();
    if(!W.series.length) W.series.push([e.idx-1,START_MMR,t-1]);
    if(!L.series.length) L.series.push([e.idx-1,START_MMR,t-1]);
    W.series.push([e.idx,W.mmr,t]); L.series.push([e.idx,L.mmr,t]);
    E.push(e);
  }
  state.R=R; state.E=E; state.h2h=h2h;
}

function ranked(){            // ranked players first (by MMR), provisional players after

function readScores(){                     // null = invalid (toast shown)

  if(!swv||!slv){ toast('Fill in both scores – or leave both empty.',true); return null; }
  const ws=parseInt(swv,10), ls=parseInt(slv,10);
  if(isNaN(ws)||isNaN(ls)||ws<0||ls<0){ toast('Scores must be numbers.',true); return null; }
  if(ws<=ls){ toast('The winner needs the higher score 🙂',true); return null; }
  return {ws,ls};
}
async function saveMatch(spin=null){

  const w=P(sel.w), l=P(sel.l), Rw=state.R[w.id], Rl=state.R[l.id];

  if(to){
    try{ const m=await saveTMatch(to.t,w.id,l.id,to.round??null,to.slot??null,ws,ls); sel={w:null,l:null}; recAs=''; await refresh();

      w:w.id, l:l.id, dW:d.dW, dL:d.dL, pW:d.pW, spin,

function renderDash(){

  // highlights
  const by=(f,cmp=(a,b)=>b-a)=>[...rk].sort((a,b)=>cmp(f(a),f(b)))[0];

function hsCard(){
  const hg=state.E.filter(e=>e.hs); if(!hg.length) return '';

  const favWon=judged.filter(e=>e.winner_id!==e.head_start_player).length, n=judged.length, rate=n?favWon/n:0;
  let verdict='Play a few more to see whether the head starts are fair.';
  if(n>=10) verdict = rate>0.65?'⚠️ The favourite wins too often, so head starts may be too small.':rate<0.35?'⚠️ The favourite loses too often, so head starts may be too big.':'✅ Looks balanced: head starts are doing their job.';
  const byP={}; hg.forEach(e=>{ [e.winner_id,e.loser_id].forEach(id=>{byP[id]=byP[id]||{w:0,l:0};}); byP[e.winner_id].w++; byP[e.loser_id].l++; });
  const top=Object.entries(byP).filter(([id])=>P(id)).sort((a,b)=>(b[1].w-b[1].l)-(a[1].w-a[1].l)||b[1].w-a[1].w).slice(0,5);

function drawMmrChart(canvasId, players){
  if(window.Chart&&!drawMmrChart._styled){ Chart.defaults.font.family='Inter, "Segoe UI", system-ui, sans-serif'; Chart.defaults.color='#66757f'; drawMmrChart._styled=true; }
  const cv=document.getElementById(canvasId); if(!cv) return;
  if(typeof Chart==='undefined'){ cv.parentElement.innerHTML='<p class="muted">Chart library could not load (offline?).</p>'; return; }
  if(charts[canvasId]) charts[canvasId].destroy();
  const byDate=chartOpt.axis==='date', t0=rangeStart();
  const firstIdx=(state.E.find(e=>new Date(e.played_at).getTime()>=t0)||{idx:state.E.length+1}).idx;
  let xmin=Infinity;
  const datasets=players.map(p=>{
    const ser=state.R[p.id].series; const pts=[]; let before=null;
    for(const [idx,mmr,t] of ser){
      if(t<t0){ before=[idx,mmr,t]; continue; }
      if(before&&!pts.length) pts.push({x:byDate?t0:firstIdx-1,y:before[1],e:null});  // carry value into range
      pts.push({x:byDate?t:idx,y:mmr,e:idx});
    }
    if(!pts.length && before) pts.push({x:byDate?t0:firstIdx-1,y:before[1]});   // no games in range: flat line
    if(pts.length){ if(byDate) pts.push({x:Date.now(),y:pts[pts.length-1].y,end:true}); else pts.push({x:state.E.length,y:pts[pts.length-1].y,end:true}); }
    pts.forEach(q=>xmin=Math.min(xmin,q.x));
    const col=pColor(p.id);
    return {label:p.name,data:pts,borderColor:col,backgroundColor:col,borderWidth:2.5,
      pointRadius:c=>(c.raw&&c.raw.e&&players.length<=3)?3:0,pointHoverRadius:5,tension:.2,stepped:false};
  });
  const ttTitle=items=>{ const r=items[0].raw; if(r.end) return 'Now'; if(!r.e) return byDate?fmtDay(r.x):'Start';
    const e=state.E[r.e-1]; return `Match #${r.e} · ${fmtDate(e.played_at)}`; };
  const ttLabel=c=>{ const r=c.raw; let s=` ${c.dataset.label}: ${r.y} MMR`;
    if(r.e){ const e=state.E[r.e-1]; const won=P(e.winner_id)?.name===c.dataset.label;
      s+= won?`  (won vs ${P(e.loser_id)?.name}, ${sgn(e.dW)})`:`  (lost vs ${P(e.winner_id)?.name}, ${e.dL})`; }
    return s; };
  charts[canvasId]=new Chart(cv,{type:'line',data:{datasets},
    options:{responsive:true,maintainAspectRatio:false,parsing:false,animation:{duration:300},
      interaction:{mode:players.length>1?'nearest':'index',intersect:false},
      plugins:{legend:{display:players.length>1&&players.length<=12,position:'bottom'},
        tooltip:{callbacks:{title:ttTitle,label:ttLabel}}},
      scales:{x:{type:'linear',min:isFinite(xmin)?xmin:undefined,
          max:byDate?Date.now():state.E.length,
          title:{display:true,text:byDate?'Date':'Match # (all league matches)'},
          ticks:{maxTicksLimit:byDate?8:12,callback:v=>byDate?fmtDay(v):Math.round(v)}},
        y:{title:{display:true,text:'MMR'},grace:'5%'}}}});
  if(!datasets.some(d=>d.data.length)) cv.parentElement.insertAdjacentHTML('beforeend','<p class="muted small" style="position:absolute;top:40%;width:100%;text-align:center">No games in this period.</p>');
}
function renderDashChart(){
  const box=$('#dashChart'); if(!box) return;
  const pool=ranked().filter(inTeam);
  if(!chartSel) chartSel=new Set(pool.slice(0,TOP_N).map(p=>p.id));
  const shown=pool.filter(p=>chartSel.has(p.id));
  box.innerHTML=`${chartControls('renderDashChart()')}
    <div class="chips">${pool.map(p=>{const on=chartSel.has(p.id);return `<span class="chip ${on?'on':''}" style="${on?`border-color:${pColor(p.id)}`:''}" onclick="toggleChart('${p.id}')">${avatar(p,36)}${esc(p.name.split(' ')[0])}${on?`<span class="sw" style="background:${pColor(p.id)}"></span>`:''}</span>`;}).join('')}
      <span class="small muted" style="align-self:center">Show:</span>
      <button class="linkbtn" onclick="chartSel=new Set(ranked().filter(inTeam).slice(0,${TOP_N}).map(p=>p.id));renderDashChart()">Top ${TOP_N}</button>
      <button class="linkbtn" onclick="chartSel=new Set(ranked().filter(inTeam).map(p=>p.id));renderDashChart()">All</button>
      <button class="linkbtn" onclick="chartSel=new Set();renderDashChart()">None</button></div>
    <div class="chartbox"><canvas id="mmrChart"></canvas></div>`;
  if(shown.length) drawMmrChart('mmrChart',shown);
  else $('#mmrChart').parentElement.innerHTML='<div class="empty">Tap players above to add them to the chart.</div>';
}
function toggleChart(id){ chartSel.has(id)?chartSel.delete(id):chartSel.add(id); renderDashChart(); }
function renderProfChart(id){
  const box=$('#profChartBox'); if(!box) return;
  box.innerHTML=chartControls(`renderProfChart('${id}')`)+'<div class="chartbox" style="height:240px"><canvas id="profChart"></canvas></div>';
  drawMmrChart('profChart',[P(id)]);
}

function renderPlayers(){
  const ps=[...state.players].filter(inTeam).sort((a,b)=>(b.active!==false)-(a.active!==false)||state.R[b.id].mmr-state.R[a.id].mmr);
  $('#v-players').innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Players</h2><p class="sub">Click a player for their full profile. Use ✏️ to change name or photo.</p>${teamSeg('renderPlayers()')}</div>
    <button class="btn primary" onclick="openPlayerForm()">➕ Add player</button></div>
    ${ps.length?`<div class="pcards">${ps.map(p=>{const r=state.R[p.id];return `<div class="pc ${p.active===false?'inactive':''}" onclick="openProfile('${p.id}')">
      <button class="edit" title="Edit" onclick="event.stopPropagation();openPlayerForm('${p.id}')">✏️</button>
      ${avatar(p,150)}<div class="n">${esc(p.name)}${(()=>{const n=state.tournaments.filter(t=>tWinner(t)===p.id).length;return n?` <span title="Tournament wins">${'🏆'.repeat(Math.min(n,5))}</span>`:'';})()}</div>${p.team?`<div style="margin-top:4px"><span class="teamtag">${esc(p.team)}</span></div>`:''}<div class="tg">${esc(p.tagline||'')}${p.active===false?' (hidden)':''}</div>
      <div class="st"><div><b>${r.mmr}</b>MMR</div><div><b>${r.games?pct(r.w/r.games):'–'}</b>Win %</div><div><b>${streakHtml(r.streak)}</b>Streak</div></div></div>`;}).join('')}</div>`
    :`<div class="card empty">No players yet. Add your team!</div>`}${quoteHtml()}`;
}

let galOpen=false;
const galSrc=i=>{ const a=AVATARS[i]; return a.startsWith('data:')?a:AVATAR_DIR+a; };
function galleryHtml(){
  if(!AVATARS.length) return '';
  const srcOf=a=>a.startsWith('data:')?a:AVATAR_DIR+a, all=new Set(AVATARS.map(srcOf));
  const taken={}; state.players.forEach(x=>{ if(x.photo&&all.has(x.photo)) taken[x.photo]=x.name; });
  return `<div class="gal ${galOpen?'':'hidden'}" id="pfGal">${AVATARS.map((a,i)=>{ const src=srcOf(a), me=pfPhoto===src, by=taken[src];
    return `<button type="button" class="gal-i ${me?'on':''}" title="${esc(AVATAR_NAMES[i]||'')}${by&&!me?' – also used by '+esc(by):''}" onclick="pfPhoto=galSrc(${i});pfPreview();document.querySelectorAll('.gal-i').forEach(b=>b.classList.remove('on'));this.classList.add('on')">
      <img src="${src}" alt="" loading="lazy">${by&&!me?'<span class="gal-t">✓</span>':''}</button>`; }).join('')}</div>`;
}
function openPlayerForm(id){
  const p=id?P(id):null; pfPhoto=p?.photo||null; galOpen=!pfPhoto&&AVATARS.length>0;
  const hasMatches = p && state.R[p.id].games>0;
  openModal(`<h3>${p?'Edit player':'Add player'}</h3>
    <label style="margin-top:0">Picture <span class="req">required</span></label>
    <div class="photo-pick" id="pfPick"><div id="pfPrev"></div>
      <div>${AVATARS.length?`<button type="button" class="btn" style="margin:0 6px 6px 0" onclick="galOpen=!galOpen;$('#pfGal').classList.toggle('hidden',!galOpen)">🎨 Choose a picture</button>`:''}<label class="btn ghost" style="margin:0">📷 Upload photo<input type="file" accept="image/*" id="pfFile" hidden></label>
      <div class="small muted" style="margin-top:6px">${AVATARS.length?'Pick one of our pictures, or upload your own photo.':'Any photo works – it\'s cropped to a square automatically. Tip: a close-up of your face looks best.'}</div></div></div>
    ${galleryHtml()}
    <label>Name <span class="req">required</span></label><input id="pfName" maxlength="30" oninput="this.classList.remove('bad')" value="${esc(p?.name||'')}" placeholder="e.g. Ping Pong Pete">
    <label>Tagline <span class="badge">optional</span></label><input id="pfTag" maxlength="60" value="${esc(p?.tagline||'')}" placeholder="e.g. Backhand of doom">
    <label>Team / location <span class="badge">optional</span></label><input id="pfTeam" list="teamList" maxlength="30" value="${esc(p?.team||'')}" placeholder="e.g. Office or Warehouse">
    <datalist id="teamList">${[...new Set(['Office','Warehouse',...teams()])].map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="pfActive" style="width:auto" ${p?.active===false?'':'checked'}> Show in the match picker (untick for people who left/are on leave)</label>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn primary" id="pfSave" onclick="savePlayer(${p?`'${p.id}'`:'null'})">💾 Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${p?`<button class="btn danger" style="margin-left:auto" onclick="deletePlayer('${p.id}',${hasMatches})">${hasMatches?'🗑️ Delete player & matches':'Delete'}</button>`:''}
    </div>${p&&hasMatches?'<p class="small muted">Deleting a player with matches also removes their match history and recalculates MMR for everyone else.</p>':''}`);
  pfPreview();
  $('#pfFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ pfPhoto=await resizeImage(f,480); pfPreview(); }catch(err){ toast(err.message,true); } };
  setTimeout(()=>$('#pfName').focus(),50);
}
function pfPreview(){ if(pfPhoto) $('#pfPick')?.classList.remove('bad'); $('#pfPrev').innerHTML=avatar({id:'preview',name:$('#pfName')?.value||'?',photo:pfPhoto},110); }
function resizeImage(file,size){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not read that image – try a JPG or PNG.')); };
    img.src=url; });
}
async function savePlayer(id){
  const name=$('#pfName').value.trim();
  const noName=!name, noPic=!pfPhoto;
  $('#pfName').classList.toggle('bad',noName); $('#pfPick').classList.toggle('bad',noPic);
  if(noPic&&AVATARS.length){ galOpen=true; $('#pfGal')?.classList.remove('hidden'); }
  if(noName&&noPic) return toast('Please enter a name and choose a picture.',true);
  if(noName){ $('#pfName').focus(); return toast('Please enter a name.',true); }
  if(noPic) return toast('Please choose a picture (or upload your own photo).',true);
  if(state.players.some(p=>p.id!==id && p.name.toLowerCase()===name.toLowerCase())) return toast('Someone already has that name.',true);
  const data={name,tagline:$('#pfTag').value.trim()||null,team:$('#pfTeam').value.trim()||null,photo:pfPhoto,active:$('#pfActive').checked};
  $('#pfSave').disabled=true;
  try{ id?await store.updatePlayer(id,data):await store.addPlayer(data); closeModal(); await refresh(); toast(id?'Player updated':`Welcome, ${esc(name)}! 🏓`); }
  catch(e){ toast('Could not save: '+esc(e.message),true); $('#pfSave').disabled=false; }
}
async function deletePlayer(id, hasMatches=false){
  const pl = P(id);
  const name = pl ? pl.name : 'this player';
  if(hasMatches){
    if(!confirm(`Delete ${name} AND all their matches? This will remove all their match history and recalculate MMR.`)) return;
  } else {
    if(!confirm(`Delete ${name}?`)) return;
  }
  try{
    if(hasMatches){
      const ms = state.matches.filter(m => m.winner_id === id || m.loser_id === id);
      for(const m of ms){
        await store.deleteMatch(m.id);
      }
    }
    await store.deletePlayer(id);
    closeModal();
    await refresh();
    toast(`${name} and their matches were deleted`);
  }catch(e){
    toast('Could not delete: ' + esc(e.message), true);
  }
}
function openProfile(id){

    </div>

function ymd(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
const pd=s=>new Date(s+'T00:00:00');
const todayStr=()=>ymd(new Date());
const fmtD=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function fmtRange(t){ return t.start_date&&t.end_date?`${fmtD(t.start_date)} – ${fmtD(t.end_date)}, ${pd(t.end_date).getFullYear()}`:''; }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day); const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x-y0)/864e5+1)/7); }
const T=id=>state.tournaments.find(t=>t.id===id);
const inT=(t,id)=>state.tplayers.some(x=>x.tournament_id===t.id&&x.player_id===id);
const tPlayers=t=>state.tplayers.filter(x=>x.tournament_id===t.id).map(x=>P(x.player_id)).filter(Boolean).sort((a,b)=>state.R[b.id].mmr-state.R[a.id].mmr);
const tMatches=t=>state.tmatches.filter(m=>m.tournament_id===t.id).sort((a,b)=>new Date(a.played_at)-new Date(b.played_at));
const T_ICON={monthly:'📅',weekly:'🗓️',knockout:'🥊'};

function roundName(r,nR){ const left=nR-r; return left===0?'Final':left===1?'Semi-finals':left===2?'Quarter-finals':`Round of ${2**(left+1)}`; }

function tStatus(t){            // signup | upcoming | live | finished
  if(t.kind==='knockout'){ if(t.status==='signup') return 'signup'; return bracket(t).champion?'finished':'live'; }
  const d=todayStr(); return d<t.start_date?'upcoming':d>t.end_date?'finished':'live';
}
const ST_PILL={signup:['📝 Sign-up open','#e6ecf7','#0B1F4B'],upcoming:['⏳ Upcoming','#fff4d6','#7a5a00'],live:['🟢 Live','#e3f5ea','#1E9E5A'],finished:['🏁 Finished','#eee','#555']};

/* League: win = 3 pts, loss = 1 pt (showing up counts). Only the first N games per pair count. */
function leagueTable(t){
  const s=t.settings||{}, win=s.win_pts??3, loss=s.loss_pts??1, maxPair=s.max_per_pair||0;
  const rows={}; tPlayers(t).forEach(p=>rows[p.id]={p,w:0,l:0,pts:0,gp:0,form:[]});
  const pc={}, uncounted=new Set();
  for(const m of tMatches(t)){
    const W=rows[m.winner_id], L=rows[m.loser_id]; if(!W||!L){uncounted.add(m.id);continue;}
    const k=[m.winner_id,m.loser_id].sort().join('|'); pc[k]=(pc[k]||0)+1;
    if(maxPair&&pc[k]>maxPair){uncounted.add(m.id);continue;}
    W.w++;W.gp++;W.pts+=win;W.form.push('W'); L.l++;L.gp++;L.pts+=loss;L.form.push('L');
  }
  const wr=r=>r.gp?r.w/r.gp:0;
  const list=Object.values(rows).sort((a,b)=>b.pts-a.pts||b.w-a.w||wr(b)-wr(a)||a.p.name.localeCompare(b.p.name));
  return {list,uncounted,win,loss,maxPair};
}
/* Knockout: standard seeding (1 v 8, 4 v 5 …), byes for top seeds, best of 1 */
function seedOrder(size){ let o=[1]; while(o.length<size){ const m=o.length*2; o=o.flatMap(x=>[x,m+1-x]); } return o; }
function bracket(t){
  const seeds=(t.settings?.seeds||[]).filter(id=>P(id)); const n=seeds.length;
  if(n<2) return {rounds:[],nR:0,champion:null,seeds};
  let size=2; while(size<n) size*=2; const nR=Math.log2(size), order=seedOrder(size);
  const res={}; tMatches(t).forEach(m=>res[m.round+'|'+m.slot]=m);
  const rounds=[];
  for(let r=1;r<=nR;r++){ const arr=[];
    for(let s=0;s<size/2**r;s++){
      const a = r===1 ? (seeds[order[2*s]-1]||null)   : rounds[r-2][2*s].winner;
      const b = r===1 ? (seeds[order[2*s+1]-1]||null) : rounds[r-2][2*s+1].winner;
      const m=res[r+'|'+s]; let winner=null, bye=false, mm=null;
      if(a&&b&&m&&(m.winner_id===a||m.winner_id===b)){ winner=m.winner_id; mm=m; }
      else if(r===1&&a&&!b){ winner=a; bye=true; } else if(r===1&&b&&!a){ winner=b; bye=true; }
      arr.push({r,s,a,b,m:mm,winner,bye,playable:!!(a&&b&&!winner)});
    }
    rounds.push(arr);
  }
  return {rounds,nR,champion:rounds[nR-1][0].winner,seeds};
}
function tWinner(t){
  if(tStatus(t)!=='finished') return null;
  if(t.kind==='knockout') return bracket(t).champion;
  const top=leagueTable(t).list[0]; return top&&top.gp?top.p.id:null;
}
function tLeader(t){
  if(t.kind==='knockout'){ const b=bracket(t); if(b.champion) return {p:P(b.champion),txt:'Champion'};
    if(t.status==='signup') return null; const cur=b.rounds.find(rd=>rd.some(x=>x.playable)); return cur?{txt:roundName(cur[0].r,b.nR)+' in progress'}:null; }
  const top=leagueTable(t).list[0]; return top&&top.gp?{p:top.p,txt:`${tStatus(t)==='finished'?'Winner':'Leader'} · ${top.pts} pts`}:null;
}
function tournOptions(w,l){      // tournaments this pair could be playing for right now
  const out=[];
  for(const t of state.tournaments){ const st=tStatus(t);
    if(t.kind!=='knockout'){ if(st==='live'&&inT(t,w)&&inT(t,l)) out.push({t}); continue; }
    if(st!=='live') continue;
    const b=bracket(t);
    for(const rd of b.rounds) for(const x of rd)
      if(x.playable&&((x.a===w&&x.b===l)||(x.a===l&&x.b===w))) out.push({t,round:x.r,slot:x.s,label:roundName(x.r,b.nR)});
  }
  return out;
}

const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el,to,dur=900,prefix=''){
  if(reduceMotion()){ el.textContent=prefix+to; return; }
  const from=0, t0=performance.now();
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=prefix+Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function runCountUps(root=document){ root.querySelectorAll('[data-count]').forEach(el=>{ const v=+el.dataset.count; if(!isNaN(v)) countUp(el,v,v>500?1100:800); }); }
function confetti(canvas,big=false){
  if(reduceMotion()||!canvas) return;
  const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
  const W=canvas.width=canvas.offsetWidth*dpr, H=canvas.height=canvas.offsetHeight*dpr;
  const cols=['#FF6A2B','#F5B811','#FFE27A','#ffffff','#7ff0bd','#3B8FD9'];
  const N=big?260:150, parts=[];
  for(let i=0;i<N;i++){ const side=i%2?1:-1;
    parts.push({x:W/2+side*W*0.05, y:H*0.55, vx:(Math.random()*0.9+0.2)*side*W/90*(Math.random()<.3?-.4:1), vy:-(Math.random()*H/55+H/110),
      r:(Math.random()*6+4)*dpr, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*0.3, shape:Math.random()<.5?0:1}); }
  const t0=performance.now(), life=big?4200:3200;
  const tick=t=>{ const el=t-t0; ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.vy+=H/3600; p.vx*=0.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-el/life); ctx.fillStyle=p.c;
      if(p.shape) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.6,0,7); ctx.fill(); }
      ctx.restore(); }
    if(el<life && document.body.contains(canvas)) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

// Web Audio synth for ping-pong click / bounce sound
let _audioCtx = null;
function playHeartbeatSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
    const osc = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, _audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, _audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.4, _audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.18);
    osc.connect(gain); gain.connect(_audioCtx.destination);
    osc.start(); osc.stop(_audioCtx.currentTime + 0.18);
  }catch(e){}
}
function playPingPongSound(pitch = 750, duration = 0.04){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
    const osc = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(pitch, _audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(pitch * 0.45, _audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.28, _audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(_audioCtx.destination);
    osc.start();
    osc.stop(_audioCtx.currentTime + duration);
  }catch(e){}
}

  return `<svg viewBox="0 0 50 64" width="56" height="72">
